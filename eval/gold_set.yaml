# =============================================================================
# Retrieval gold set
# =============================================================================
#
# Each case declares what CORRECT EVIDENCE looks like, independent of how an
# answer is phrased. We grade retrieval rather than generation: if the right
# passage never surfaces, no amount of answer polish can save the response.
#
# Matchers are field and substring tests, never passage ids, so the set stays
# valid as the corpus is regenerated with a different seed.
#
#   text_contains     any listed string appears in the passage text
#   section_contains  any listed string appears in the section heading
#   doc.<field>       substring test against the source document's metadata
#
# Categories:
#   lexical    the query uses the corpus's own words — BM25 should win outright
#   semantic   vocabulary mismatch; the user's words are absent from the corpus,
#              so only the LSA retriever can bridge them
#   cross      evidence must come from more than one document type
#   adversarial  plausible-sounding but genuinely absent — retrieval should be
#              weak, and the system should decline rather than confabulate

cases:

  # ------------------------------------------------------------------ q-airlines
  - id: air-lex-01
    tenant: q-airlines
    category: lexical
    question: "What is the repair interval for a Category B MEL item?"
    relevant_any:
      - text_contains: ["repair interval", "MEL", "minimum equipment"]
      - doc.abbrev: "MEL"

  - id: air-lex-02
    tenant: q-airlines
    category: lexical
    question: "dispatch release fuel plan and alternates"
    relevant_any:
      - doc.abbrev: "DR"
      - text_contains: ["dispatch", "fuel", "alternate"]

  - id: air-sem-01
    tenant: q-airlines
    category: semantic
    question: "how do we recover when flights are badly disrupted"
    notes: "Corpus says 'irregular operations', never 'badly disrupted'."
    relevant_any:
      - text_contains: ["irregular operations", "recovery", "IROPS"]
      - doc.abbrev: "IROPS"

  - id: air-sem-02
    tenant: q-airlines
    category: semantic
