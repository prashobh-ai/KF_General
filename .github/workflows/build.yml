name: build

# ORDER IS LOAD-BEARING. Read this before moving a step.
#
# Every generation step runs BEFORE the tests, and the tests run against the
# same artefacts that get published. An earlier version of this project shipped
# a check that had never once passed, because the step producing what it checked
# was never wired into CI.
#
# The pipeline is now:
#
#   build_tenants   writes tenants/<slug>/fabric/*      (corpora + graphs)
#   build_site      writes site/data/<slug>/*           — WIPES site/data first
#   build_bank      writes site/data/<slug>/questions.json
#   pytest          asserts against site/data
#
# build_site wipes site/data, so the bank MUST come after it. Run them the other
# way round and questions.json is deleted; the app then fails soft to the
# unmeasured pack-authored questions, the build stays green, and the demo ships
# suggestion chips scoring as low as 22%. That is precisely the silent
# regression tests/test_question_bank.py exists to catch — but it can only catch
# it if the bank step actually ran, so the order here is the real guard.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The question-bank builder runs the browser Engine under Node, so the
      # confidence numbers in questions.json are produced by the same code the
      # page runs. A separate Python reimplementation would drift from what a
      # user actually sees, which is the one thing these numbers cannot do.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install browser for UI tests
        run: python -m playwright install chromium --with-deps

      - name: Generate corpora
        run: python -m pipeline.build_tenants

      - name: Build site
        run: python -m pipeline.build_site

      - name: Measure question bank
        run: node eval/build_bank.mjs .

      - name: Safety, integrity and UI gate
        run: python -m pytest

      - name: Retrieval evaluation
        run: python -m eval.evaluate

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
